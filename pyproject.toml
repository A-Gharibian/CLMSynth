[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clmsynth"
version = "0.7.9"
description = "Generate synthetic clustering datasets with controllable class–cluster agreement, target Adjusted Rand Index (ARI) and MCC, unequal class and cluster counts, for semi-supervised learning benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
# Authorship (the method and the accompanying article) is shared; the program
# itself is written and maintained by Arootin Gharibian.
authors = [
    { name = "Arootin Gharibian", email = "arootin.gharibian@vsb.cz" },
    { name = "Milos Kudelka", email = "milos.kudelka@vsb.cz" },
]
maintainers = [
    { name = "Arootin Gharibian", email = "arootin.gharibian@vsb.cz" },
]
keywords = [
    "synthetic-data", "dataset-generator", "semi-supervised-learning", "ARI", "MCC",
    "cluster-label-matching", "partition-agreement", "label-generation",
    "benchmark-generator", "multiclass-cluster",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3",
    "scipy>=1.16.0",
    "scikit-learn>=1.7.0",
]

[project.optional-dependencies]
# A config file other than .json is read and written with PyYAML.
yaml = ["PyYAML>=6.0.1"]
# The plots in png/. A single run draws them whenever matplotlib is installed.
viz = ["matplotlib>=3.11.0"]
dev = ["pandas-stubs", "scipy-stubs", "ruff", "mypy", "bandit"]
test = ["pytest>=9", "PyYAML>=6.0.1", "matplotlib>=3.11.0"]

[dependency-groups]
test = ["pytest>=9", "PyYAML>=6.0.1", "matplotlib>=3.11.0"]
dev = [
    { include-group = "test" },
    "pandas-stubs", "scipy-stubs", "ruff", "mypy", "bandit",
    "tox>=4", "pre-commit",
]

[project.urls]
Homepage = "https://github.com/A-Gharibian/CLMSynth"
Repository = "https://github.com/A-Gharibian/CLMSynth"
Documentation = "https://github.com/A-Gharibian/CLMSynth/tree/main/docs"
Changelog = "https://github.com/A-Gharibian/CLMSynth/blob/main/CHANGELOG.md"
Issues = "https://github.com/A-Gharibian/CLMSynth/issues"
Paper = "https://doi.org/10.1016/j.softx.2026.103077"

[project.scripts]
clmsynth = "clmsynth.__main__:main"
clmsynth-config = "clmsynth._config_gen.generate_config:main"
clmsynth-wizard = "clmsynth._config_gen.config_wizard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clmsynth = ["py.typed"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Fail on an unregistered mark rather than silently treating it as a no-op.
addopts = "-ra --strict-markers --strict-config"
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]

select = [
    "E4", "E7", "E9",  # pycodestyle: the error subset, not style policing
    "F",               # pyflakes
    "I",               # import order
    "UP",              # pyupgrade: this project supports 3.12+
    "B",               # bugbear: real bug patterns
    "C4",              # comprehension clarity
    "DTZ",             # naive datetime use
    "ISC", "PIE", "RUF",
    # Pylint's error and warning subsets only. PLR is complexity metrics
    "PLE", "PLW",
    "BLE",             # blind except
    # Architecture rules, configured in [tool.ruff.lint.flake8-tidy-imports] below.
    "TID251", "TID253",
    "NPY002",          # legacy global np.random.*: every generator owns its seed
]
ignore = [
    "BLE001",
    # the folder name is for a human reading their own output directory, not a
    # timestamp to be compared across machines.
    "DTZ005",
    "RUF046",
    # Rebinding a loop variable to its own normalized form (`tok = tok.strip()`,
    # `count = min(count, len(idx_avail))`) is the intended reading here.
    "PLW2901",
]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["matplotlib", "clmsynth._extras", "yaml"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The guides are deletable: nothing in the package may import them.
"clmsynth._config_gen".msg = "core must not import the guides; they are deletable"
# Every generator owns a seeded np.random.default_rng; the stdlib module draws
# from one process-global stream.
"random".msg = "use a seeded np.random.default_rng, not the stdlib global RNG"

[tool.ruff.lint.per-file-ignores]
# The module that renders is the one place plotting is imported at top level.
"src/clmsynth/_extras/visualization.py" = ["TID253"]
# Tests import the wizard and the plotter directly, on purpose.
"tests/**" = ["TID251", "TID253"]
# The guides import each other.
"src/clmsynth/_config_gen/**" = ["TID251"]
# Repository tools, not shipped: they read YAML at the top.
"tools/**" = ["TID253"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
ignore_missing_imports = true
files = ["src/clmsynth", "tools", "tests"]
check_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.bandit]
# Read with `bandit -c pyproject.toml -r src/clmsynth`. these seven findings were traced by
# hand. The threat model throughout is a local single-user CLI and
# library, no auth boundary, and no untrusted caller (see SECURITY.md). Every
# input below is supplied by the user.
#
#   B101  Two asserts in spatial_placement guard internal allocation invariants
#         that no configuration can reach, and one in the wizard guards the
#         question schema's own shape; they are programmer errors, not user
#         input validation, which is what the [CLM-###] codes are for. Their
#         disappearance under -O is acceptable exactly because nothing user-facing depends on them.
#   B404  The wizard imports subprocess to launch the run the user just
#         finished configuring, at their explicit prompt. The batch runner
#         imports it to start one clmsynth process per config.
#   B603  Those two calls. Each argument vector is built from sys.executable,
#         fixed flags and config paths, passed after "--": the one the wizard
#         itself wrote, or the ones the batch's own command line named. No shell.
#         tools/CLM_catalog_gen.py, outside this scan, does the same with the
#         case files it writes.
skips = ["B101", "B404", "B603"]

[tool.codespell]
# Data files and the troubleshooting catalog's recorded logs are not prose.
skip = "*.csv,*.log"
# The manual's \cna table macro and a numpy dtype-kind string, not words.
ignore-regex = '\\cna|"fO"'

[tool.repo-review]
# Not used here: a formatter (PC110), a type-check hook (PC140: mypy runs in CI and
# tox), rST checks (PC170), a Markdown formatter (PC180) and pre-commit.ci (PC901).
ignore = ["PC110", "PC140", "PC170", "PC180", "PC901"]
