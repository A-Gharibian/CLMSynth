[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clmsynth"
version = "0.7.2"
description = "Synthetic label generator with configurable cluster-label matching (CLM) against ground-truth clusters"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE.txt"]
# Authorship (the method and the accompanying article) is shared; the program
# itself is written and maintained by Arootin Gharibian.
authors = [
    { name = "Arootin Gharibian", email = "arootin.gharibian@vsb.cz" },
    { name = "Milos Kudelka", email = "milos.kudelka@vsb.cz" },
]
maintainers = [
    { name = "Arootin Gharibian", email = "arootin.gharibian@vsb.cz" },
]
keywords = ["synthetic-data", "clustering", "benchmark", "cluster-label-matching", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Compatible ranges for installation as a package; requirements.txt keeps the
# exact pins used for verification.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pandas-stubs", "scipy-stubs", "ruff", "mypy", "bandit"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/A-Gharibian/CLMSynth"
Repository = "https://github.com/A-Gharibian/CLMSynth"
Documentation = "https://github.com/A-Gharibian/CLMSynth/tree/main/docs/manual"
Changelog = "https://github.com/A-Gharibian/CLMSynth/blob/main/CHANGELOG.md"
Issues = "https://github.com/A-Gharibian/CLMSynth/issues"
Paper = "https://doi.org/10.1016/j.softx.2026.103077"

[project.scripts]
clmsynth = "clmsynth.main:main"
clmsynth-config = "clmsynth.generate_config:main"
clmsynth-wizard = "clmsynth.config_wizard:main"

[tool.setuptools.packages.find]
where = ["src"]

# A ready-to-run offline config, so a wheel carries something runnable without
# a network fetch.
[tool.setuptools.package-data]
clmsynth = ["test_data_config_offline.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Fail on an unregistered mark rather than silently treating it as a no-op.
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]

select = [
    "E4", "E7", "E9",  # pycodestyle: the error subset, not style policing
    "F",               # pyflakes
    "I",               # import order
    "UP",              # pyupgrade: this project supports 3.12+
    "B",               # bugbear: real bug patterns
    "C4",              # comprehension clarity
    "DTZ",             # naive datetime use
    "ISC", "PIE", "RUF",
    # Pylint's error and warning subsets only. PLR is complexity metrics
    "PLE", "PLW",
    "BLE",             # blind except
    # Architecture rules, configured in [tool.ruff.lint.flake8-tidy-imports]
    # below. Each replaced a test that searched source text or probed imports.
    "TID251", "TID253",
    "NPY002",          # legacy global np.random.*: every generator owns its seed
]
ignore = [
    # The four fetchers and the two config writers catch broadly on purpose: a
    # dataset that cannot be fetched, generated or parsed is reported and skipped
    # so the rest of the batch survives. See main.py's per-dataset
    # error boundary for the design this serves.
    "BLE001",
    # the folder name is for a human reading their own output directory, not a
    # timestamp to be compared across machines.
    "DTZ005",
    # `int(round(x))` is flagged as redundant because np.float64.__round__
    # returns a Python int on numpy 2.x. That is true, and version-dependent:
    # numpy 1.x returned np.float64. These values become integer point counts
    # feeding allocation, where a float arriving silently would be a real defect,
    # so the cast is kept as a guard rather than removed as noise.
    "RUF046",
    # Rebinding a loop variable to its own normalized form (`tok = tok.strip()`,
    # `count = min(count, len(idx_avail))`) is the intended reading here.
    "PLW2901",
]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["matplotlib", "seaborn", "clmsynth.visualization"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The wizard is deletable: nothing in the package may import it.
"clmsynth.config_wizard".msg = "core must not import the wizard; it is deletable"
# Every generator owns a seeded np.random.default_rng; the stdlib module draws
# from one process-global stream.
"random".msg = "use a seeded np.random.default_rng, not the stdlib global RNG"

[tool.ruff.lint.per-file-ignores]
# The module that renders is the one place plotting is imported at top level.
"src/clmsynth/visualization.py" = ["TID253"]
# Tests import the wizard and the plotter directly, on purpose.
"tests/**" = ["TID251", "TID253"]

[tool.mypy]
# Python 3.11 was dropped at 0.7.0: numpy and scipy now
# require >=3.12 (SPEC 0).
ignore_missing_imports = true
files = ["src/clmsynth", "tools"]

[tool.bandit]
# Read with `bandit -c pyproject.toml -r src/clmsynth`. these five findings were traced by
# hand. The threat model throughout is a local single-user CLI and
# library, no auth boundary, and no untrusted caller (see SECURITY.md). Every
# input below is supplied by the user.
#
#   B101  Two asserts in clm_label_engine guard internal allocation invariants
#         that no configuration can reach; they are programmer errors, not user
#         input validation, which is what the [CLM-###] codes are for. Their
#         disappearance under -O is acceptable exactly because nothing user-facing depends on them.
#   B404  config_wizard imports subprocess to launch the run the user just
#         finished configuring, at their explicit prompt.
#   B603  That same call. The argument vector is built from sys.executable and
#         a config path the wizard itself wrote; no shell, no user string
#         reaching argv.
#
# B310 was here until 0.7.0 and is deliberately no longer skipped:
# _loadtxt_url now refuses any scheme other than http(s), so the finding is
# closed at the call site with an inline nosec rather than suppressed for the
# whole package. A NEW urlopen elsewhere is meant to be reported.
skips = ["B101", "B404", "B603"]
