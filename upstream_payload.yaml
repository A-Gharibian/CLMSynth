# Template for generate_config.py.
# This file is the minimal configuration;
# generate_config.py renders it into a full config.
#
# Usage:
#   python -m clmsynth.generate_config                             # reads this file
#   python -m clmsynth.generate_config my_payload.yaml             # or an explicit payload
#   python -m clmsynth.generate_config my_payload.yaml out.yaml    # and an explicit output

data_source: "clustbench"        # clustbench | mdcgen | fabricated_data | byoc
batteries: ["g2mg"]
datasets: ["g2mg_4_20"]
source_seed: 42

n_labels: 1
source_labeling: "labels0"
label_seed: 42

# g2mg_4_20 has 2 ground-truth clusters (ids 1 & 2, 1024 points each).
num_classes: 2
proportions: [0.5, 0.5]
balance: "unbalanced"            # explicit proportions take precedence; skew_rule is the fallback
skew_rule: "geometric"           # unused here (proportions present); kept for the template
matching_mode: "custom"
single_match: {cluster: null, label: null}
# One rule per cluster: route 90% of each label's points into its paired
# cluster. Feasible (needs 922 <= 1024 per cluster) and produces a strong,
# measurable cluster-label match rather than an infeasible request.
assignment_matrix:
  - {clusters: [1], label: 0, recall_target: 0.9}
  - {clusters: [2], label: 1, recall_target: 0.9}
split_rule: "equal"
spillover_rule: "proportional_to_marginal"   # honors 'proportions'; uniform/concentrated do not
centroid_enabled: true
centroid_profile: "linear"
centroid_favors: "boundary"
# centroid_steepness: 3.0        # rendered only when centroid_profile is "exponential"

# --- Optional clm_label blocks ------------------------------------------------
# Each renders only when present, so leaving them commented out produces exactly
# the config above. See the manual for the full semantics of each.

# Skew parameters, used only when balance is "unbalanced" AND proportions is unset.
# Give the keys for your skew_rule: geometric -> ratio; dominant_minority ->
# dominant_index + dominant_share; dirichlet -> alpha.
# skew_params: {ratio: 0.5}

# Leftover-point targets, used only with spillover_rule: "concentrated".
# concentrated_labels: [0]

# Structured competing noise (matching_mode single/custom only). Converts `share`
# of ONE cluster's unclaimed points to one competing label. Bypasses 'proportions'
# by design, so achieved label counts will not match them.
# competing_noise:
#   - {cluster: 1, label: 1, share: 1.0, favors: "boundary"}

# Solve the recall level for a requested agreement score instead of setting
# recall_target by hand (matching_mode single/custom only). With this set, the
# per-rule recall_target values above are ignored.
#   scope "global" (default): whole-partition mcc/ari, found by search.
#   scope "pair"            : exact closed form, but requires type "mcc" AND
#                             matching_mode "single". tolerance applies to both
#                             scopes; max_iter is global-only.
# target_metric: {type: "mcc", value: 0.6, scope: "global", tolerance: 0.01, max_iter: 40, probe_seed: 42}
