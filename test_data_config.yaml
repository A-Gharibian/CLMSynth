global_settings:
  data_source: mdcgen
  output_dir: OUTPUT
mdcgen_suite:
  batteries:
  - challenging
  datasets:
  - overlapping_2d
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 3
    matching_mode: single
    balance: unbalanced
    skew_rule: dirichlet
    skew_params:
      alpha: 1.0
    target_metric:
      type: mcc
      value: 0.6
      scope: pair
      tolerance: 0.01
    single_match:
      cluster: 1
      label: 1
    spillover_rule: proportional_to_marginal
