name: CI

permissions:
  contents: read
# NOT the `pull-requests: write` from the generic example.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same ref cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The suite, on every interpreter pyproject.toml claims to support.
  # --------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter's result.
      fail-fast: false
      matrix:
        # Must track requires-python (">=3.11,<3.15") in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs the package, so the suite imports the INSTALLED clmsynth rather
      # than a copy on sys.path.
      - name: Install the package and the test extra
        run: pip install -e ".[test]"

      - name: Package imports and reports its version
        run: python -c "import clmsynth; print('clmsynth', clmsynth.__version__)"

      # No path argument: [tool.pytest.ini_options] test paths points at tests/.
      # Passing one here would mean the config and CI could disagree about what
      # the suite is.
      - name: Run the test suite
        run: pytest -q

  # --------------------------------------------------------------------------
  # Lint, typing and security analysis.
  # --------------------------------------------------------------------------
  static-analysis:
    name: Lint, typing, security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The version the tools' own findings were traced against. Pinned.
          python-version: "3.13"
          cache: pip

      - name: Install the package and the dev toolchain
        run: pip install -e ".[dev]"

      # `continue-on-error` is deliberately NOT set: these are gates.
      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Typing (mypy)
        # Reads files and settings from [tool.mypy]; no path argument, same
        # reasoning as pytest above.
        run: mypy

      - name: Security analysis (bandit)
        # -c is required for bandit to read [tool.bandit] out of pyproject.toml;
        # without it the four judged findings recorded there come back.
        run: bandit -c pyproject.toml -r src/clmsynth -q

  # --------------------------------------------------------------------------
  # Release hygiene
  # --------------------------------------------------------------------------
  packaging:
    name: Build and metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the build tools
        run: pip install build twine

      - name: Build the sdist and wheel
        run: python -m build

      # Catches the metadata faults that are invisible until an upload is
      # rejected.
      - name: Check the built artifacts
        run: twine check dist/*

      # MANIFEST.in claims the sdist carries the manual and the full
      # troubleshooting catalog.
      - name: The sdist contains what MANIFEST.in promises
        run: |
          python - <<'PY'
          import sys, tarfile, pathlib

          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          names = tarfile.open(sdist).getnames()
          stripped = {n.split("/", 1)[1] for n in names if "/" in n}

          required = [
              "README.md",
              "CHANGELOG.md",
              "LICENSE.txt",
              "CITATION.cff",
              "SECURITY.md",
              "requirements.txt",
              "pyproject.toml",
              "src/clmsynth/__init__.py",
              "docs/ROADMAP.md",
              "src/engine_internals.md",
              "docs/manual/CLMSynth_manual.tex",
              "docs/troubleshooting_catalog/_data/k65_clusters.csv",
          ]
          missing = [p for p in required if p not in stripped]

          # The catalog is a user-facing reproduction set: every documented code
          # ships with the config that triggers it and the log it produced.
          yamls = sum(p.startswith("docs/troubleshooting_catalog/") and p.endswith(".yaml")
                      for p in stripped)
          logs = sum(p.startswith("docs/troubleshooting_catalog/") and p.endswith(".log")
                     for p in stripped)

          print(f"{sdist.name}: {len(stripped)} entries, {yamls} catalog configs, {logs} logs")
          if missing:
              print("MISSING from the sdist:", *missing, sep="\n  ")
          if yamls != logs:
              print(f"catalog is lopsided: {yamls} .yaml against {logs} .log")
          sys.exit(1 if missing or yamls != logs else 0)
          PY

      # Every declaration of the version has to agree: four in metadata (one of
      # them twice, in codemeta's downloadUrl tag) and one per shipped document.
      # The release DATE is declared three times over and is checked with them:
      # it is the half that survives a version bump untouched, so nothing else
      # would catch it.
      - name: Version agrees across every declaration
        run: |
          python - <<'PY'
          import sys, re, json, pathlib, tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = pyproject["project"]["version"]

          found = {"pyproject.toml": version}

          init = pathlib.Path("src/clmsynth/__init__.py").read_text(encoding="utf-8")
          found["__init__.py"] = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)

          cff = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          found["CITATION.cff"] = re.search(r"^version:\s*(\S+)", cff, re.M).group(1)

          codemeta = json.loads(pathlib.Path("codemeta.json").read_text(encoding="utf-8"))
          found["codemeta.json"] = codemeta.get("version", "(absent)")
          # The tag the archive URL points at is a second, easily forgotten copy.
          tag = re.search(r"/v([^/]+)\.tar\.gz$", codemeta.get("downloadUrl", ""))
          found["codemeta.json downloadUrl"] = tag.group(1) if tag else "(unparsable)"

          for tex in sorted(pathlib.Path("docs").rglob("*.tex")):
              head = tex.read_text(encoding="utf-8", errors="replace")[:2000]
              m = re.search(r"^%\s*!CLMSynth-version\s*=\s*(\S+)", head, re.M)
              if m:
                  found[tex.name] = m.group(1)

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          dated = re.search(rf"^##\s*\[{re.escape(version)}\]\s*[-—]\s*(\S+)",
                            changelog, re.M)

          for name, value in found.items():
              print(f"  {name:45s} {value}")
          disagree = {n: v for n, v in found.items() if v != version}

          # The CHANGELOG entry's date is the reference the other two follow.
          stale = {}
          if dated:
              release_date = dated.group(1)
              dates = {
                  "CITATION.cff date-released":
                      re.search(r"^date-released:\s*(\S+)", cff, re.M).group(1),
                  "codemeta.json dateModified": codemeta.get("dateModified", "(absent)"),
              }
              for name, value in dates.items():
                  print(f"  {name:45s} {value}")
              stale = {n: v for n, v in dates.items() if v != release_date}

          if disagree:
              print("\nversion disagreement against pyproject's", version)
              for name, value in disagree.items():
                  print(f"  {name} declares {value}")
          if not dated:
              print(f"\nCHANGELOG.md has no dated [{version}] entry")
          if stale:
              print(f"\ndate disagreement against the CHANGELOG's {dated.group(1)}")
              for name, value in stale.items():
                  print(f"  {name} declares {value}")
          sys.exit(1 if disagree or not dated or stale else 0)
          PY
