name: CI

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same ref cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The suite, on every interpreter pyproject.toml claims to support.
  # --------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter's result.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and the test extra
        run: pip install -e ".[test]"

      - name: Package imports and reports its version
        run: python -c "import clmsynth; print('clmsynth', clmsynth.__version__)"

      - name: Run the test suite
        run: pytest -q

  # --------------------------------------------------------------------------
  # The suite at the oldest versions pyproject.toml accepts. The matrix above
  # always installs the newest, so it never tests the floors.
  # --------------------------------------------------------------------------
  floors:
    name: Tests (dependency floors, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Every `name>=X` in dependencies and the yaml and test extras becomes
      # `name==X`. A dependency without a floor stops the job here.
      - name: Pin every dependency to its floor
        run: |
          python - <<'PY'
          import re, tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          extras = project["optional-dependencies"]
          floors = {}
          for spec in project["dependencies"] + extras["yaml"] + extras["test"]:
              name, floor = re.match(r"([\w.-]+)>=([\w.]+)", spec.replace(" ", "")).groups()
              floors[name] = floor
          with open("floors.txt", "w") as f:
              f.writelines(f"{name}=={floor}\n" for name, floor in floors.items())
          PY
          cat floors.txt

      - name: Install the package and the test extra at the floors
        run: pip install -c floors.txt -e ".[test]"

      - name: Run the test suite
        run: pytest -q

  # --------------------------------------------------------------------------
  # Lint, typing and security analysis.
  # --------------------------------------------------------------------------
  static-analysis:
    name: Lint, typing, security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The version the tools' own findings were traced against. Pinned.
          python-version: "3.13"
          cache: pip

      - name: Install the package and the dev toolchain
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ tools/

      - name: Typing (mypy)
        run: mypy

      - name: Security analysis (bandit)
        run: bandit -c pyproject.toml -r src/clmsynth -q

  # --------------------------------------------------------------------------
  # Release hygiene
  # --------------------------------------------------------------------------
  packaging:
    name: Build and metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the build tools
        run: pip install build twine "PyYAML>=6.0.1"

      - name: Build the sdist and wheel
        run: python -m build

      # Catches the metadata faults that are invisible until an upload is
      # rejected.
      - name: Check the built artifacts
        run: twine check dist/*

      # MANIFEST.in claims the sdist carries the manual and the full
      # troubleshooting catalog.
      - name: The sdist contains what MANIFEST.in promises
        run: |
          python - <<'PY'
          import sys, tarfile, pathlib

          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          names = tarfile.open(sdist).getnames()
          stripped = {n.split("/", 1)[1] for n in names if "/" in n}

          required = [
              "README.md",
              "CHANGELOG.md",
              "LICENSE.txt",
              "CITATION.cff",
              "codemeta.json",
              "SECURITY.md",
              "requirements.txt",
              "pyproject.toml",
              "src/clmsynth/__init__.py",
              "docs/ROADMAP.md",
              "docs/engine_internals.md",
              "docs/TESTING.md",
              "docs/sources/manual/CLMSynth_manual.tex",
              "docs/troubleshooting_catalog/_data/127_65_clusters.csv",
              "docs/troubleshooting_catalog/_data/133_missing_cluster_ids.csv",
          ]
          missing = [p for p in required if p not in stripped]

          # The catalog is a user-facing reproduction set: every documented code
          # ships with the config that triggers it and the log it produced.
          yamls = sum(p.startswith("docs/troubleshooting_catalog/") and p.endswith(".yaml")
                      for p in stripped)
          logs = sum(p.startswith("docs/troubleshooting_catalog/") and p.endswith(".log")
                     for p in stripped)

          print(f"{sdist.name}: {len(stripped)} entries, {yamls} catalog configs, {logs} logs")
          if missing:
              print("MISSING from the sdist:", *missing, sep="\n  ")
          if yamls != logs:
              print(f"catalog is lopsided: {yamls} .yaml against {logs} .log")
          sys.exit(1 if missing or yamls != logs else 0)
          PY

      # Nothing else proves the wheel is usable
      - name: The wheel installs, imports, and brings its console scripts
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/python -c "import clmsynth; print('clmsynth', clmsynth.__version__)"
          for script in clmsynth clmsynth-config clmsynth-wizard; do
            test -x "/tmp/probe/bin/$script" || { echo "missing console script: $script"; exit 1; }
            echo "  console script present: $script"
          done
          # The bundled offline example runs on the base install, no extra.
          config=$(/tmp/probe/bin/python -c "from importlib.resources import files; print(files('clmsynth') / 'test_data_config_offline.json')")
          (cd /tmp && /tmp/probe/bin/clmsynth "$config" --no-viz)

      - name: Version and date agree across every declaration
        run: python tools/check_release_metadata.py
