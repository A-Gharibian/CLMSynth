name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false          # never abandon an upload half-done

# Where a final release (X.Y.Z) is uploaded: testpypi or pypi. Where a release
# candidate (X.Y.ZrcN) is uploaded: testpypi, or none to build and verify it only,
# its dist kept as this run's artifact.
env:
  FINAL_RELEASE_INDEX: testpypi
  RC_RELEASE_INDEX: testpypi

jobs:
  # --------------------------------------------------------------------------
  # Build once.
  # --------------------------------------------------------------------------
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.route.outputs.version }}
      target: ${{ steps.route.outputs.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PyYAML
        run: pip install "PyYAML>=6.0.1"

      - name: Tag and metadata agree
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python tools/check_release_metadata.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_release_metadata.py
          fi

      - name: Read the version and route the upload
        id: route
        run: |
          case "$FINAL_RELEASE_INDEX" in
            testpypi|pypi) ;;
            *) echo "::error::FINAL_RELEASE_INDEX is '$FINAL_RELEASE_INDEX'; it must be testpypi or pypi. Nothing was uploaded."
               exit 1 ;;
          esac
          case "$RC_RELEASE_INDEX" in
            testpypi|none) ;;
            *) echo "::error::RC_RELEASE_INDEX is '$RC_RELEASE_INDEX'; it must be testpypi or none. Nothing was uploaded."
               exit 1 ;;
          esac
          VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          SHAPE=$(python -c "import re, sys; v = sys.argv[1]; print('rc' if re.fullmatch(r'[0-9]+(\.[0-9]+)*rc[0-9]+', v) else 'final' if re.fullmatch(r'[0-9]+(\.[0-9]+)*', v) else 'none')" "$VERSION")
          case "$SHAPE" in
            rc)    TARGET=$RC_RELEASE_INDEX
                   echo "$VERSION is a release candidate -> $TARGET (RC_RELEASE_INDEX)" ;;
            final) TARGET=$FINAL_RELEASE_INDEX
                   echo "$VERSION is a final release -> $TARGET (FINAL_RELEASE_INDEX)" ;;
            *)     echo "::error::$VERSION is neither a release candidate (X.Y.ZrcN) nor a final release (X.Y.Z). Only vX.Y.ZrcN and vX.Y.Z publish; nothing was uploaded."
                   exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Install the build tools
        run: pip install build twine

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the built artifacts
        run: twine check dist/*

      - name: The wheel installs, imports, and brings its console scripts
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/python -c "import clmsynth; print('clmsynth', clmsynth.__version__)"
          for script in clmsynth clmsynth-config clmsynth-wizard; do
            test -x "/tmp/probe/bin/$script" || { echo "missing console script: $script"; exit 1; }
            echo "  console script present: $script"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # --------------------------------------------------------------------------
  # Publish. No token anywhere: Trusted Publishing (OIDC) exchanges the
  # workflow's identity for a short-lived credential, and PyPI generates PEP 740
  # attestations from it. The environment carries the approval gate.
  # --------------------------------------------------------------------------
  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/clmsynth
    permissions:
      id-token: write                # the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi                     # the approval gate for the real index
      url: https://pypi.org/p/clmsynth
    permissions:
      id-token: write                # the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # No repository-url: the action defaults to PyPI.
      - uses: pypa/gh-action-pypi-publish@release/v1
