# Conda environment for CLMSynth.
#   conda env create -f environment.yml
#   conda activate clmsynth
name: clmsynth
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.16
  - numpy>=2.0
  - pandas>=3.0
  - scipy>=1.13
  - scikit-learn>=1.4.2
  - matplotlib-base>=3.8.4
  - pyyaml>=6.0.1   # optional: config files other than .json
  # Optional, feature-specific:
  # - pip:
  #     - git+https://github.com/CN-TU/mdcgenpy # data_source: "mdcgen"
