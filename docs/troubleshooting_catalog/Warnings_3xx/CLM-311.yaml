# [CLM-311] centroid_dependence under random
# Regenerated against the shipped engine by tools/CLM_catalog_gen.py
# in the CLMSynth source repository.
# Reproduce: cd to this catalog's root, then
#     python -m clmsynth.main Warnings_3xx/CLM-311.yaml --no-viz
global_settings:
  data_source: fabricated_data
  output_dir: _scratch/CLM-311
fabricated_data_suite:
  batteries:
  - fabricated
  datasets:
  - labels_only_4class
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 4
    proportions:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    balance: unbalanced
    skew_rule: geometric
    matching_mode: random
    split_rule: proportional_to_size
    spillover_rule: proportional_to_marginal
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
