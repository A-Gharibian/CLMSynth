# [CLM-207] clusters missing inside a rule
# Regenerated by make_catalog.py against the shipped engine.
# Reproduce: cd to this catalog's root, then
#     python -m clmsynth.main KeyError_2xx/CLM-207.yaml
global_settings:
  data_source: fabricated_data
  output_dir: _scratch/CLM-207
fabricated_data_suite:
  batteries:
  - fabricated
  datasets:
  - baseline_4class
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 4
    proportions:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    balance: unbalanced
    skew_rule: geometric
    matching_mode: custom
    assignment_matrix:
    - label: 0
      recall_target: 0.8
    split_rule: proportional_to_size
    spillover_rule: proportional_to_marginal
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
