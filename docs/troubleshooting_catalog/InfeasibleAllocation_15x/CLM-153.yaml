# [CLM-153] two assignment_matrix rules name the same label and over-claim it

global_settings:
  data_source: fabricated_data
  output_dir: Z:\Output\CLM-153
fabricated_data_suite:
  batteries:
  - fabricated
  datasets:
  - baseline_4class
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 4
    proportions:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    balance: unbalanced
    skew_rule: geometric
    matching_mode: custom
    assignment_matrix:
    - clusters:
      - 0
      label: 0
      recall_target: 0.6
    - clusters:
      - 1
      label: 0
      recall_target: 0.6
    split_rule: proportional_to_size
    spillover_rule: proportional_to_marginal
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
