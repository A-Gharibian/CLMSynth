# [CLM-127] dataset cluster count K > 64 (byoc, 65 clusters)
# Regenerated by CLM_catalog_gen.py against the shipped engine.
# Reproduce: cd to this catalog's root, then
#     python -m clmsynth.main ValueError_1xx/CLM-127.yaml
global_settings:
  data_source: byoc
  output_dir: _scratch/CLM-127
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 4
    proportions:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    balance: unbalanced
    skew_rule: geometric
    matching_mode: custom
    assignment_matrix:
    - clusters:
      - 0
      label: 0
      recall_target: 0.8
    - clusters:
      - 1
      label: 1
      recall_target: 0.8
    - clusters:
      - 2
      label: 2
      recall_target: 0.8
    - clusters:
      - 3
      label: 3
      recall_target: 0.8
    split_rule: proportional_to_size
    spillover_rule: proportional_to_marginal
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
byoc_suite:
  batteries:
  - local
  input_dir: _data
  datasets:
  - k65_clusters
  cluster_column: cluster
  standardize: false
  seed: 42
