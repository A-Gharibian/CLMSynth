# [CLM-102] perfect with M != K
# Regenerated by CLM_catalog_gen.py against the shipped engine.
# Reproduce: cd to this catalog's root, then
#     python -m clmsynth.main ValueError_1xx/CLM-102.yaml
global_settings:
  data_source: fabricated_data
  output_dir: _scratch/CLM-102
fabricated_data_suite:
  batteries:
  - fabricated
  datasets:
  - baseline_4class
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 3
    balance: balanced
    skew_rule: geometric
    matching_mode: perfect
    split_rule: proportional_to_size
    spillover_rule: proportional_to_marginal
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
