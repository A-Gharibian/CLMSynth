# [CLM-130] scope 'pair' with a spillover rule that can emit the target label
# Regenerated by CLM_catalog_gen.py against the shipped engine.
# Reproduce: cd to this catalog's root, then
#     python -m clmsynth.main ValueError_1xx/CLM-130.yaml
global_settings:
  data_source: fabricated_data
  output_dir: _scratch/CLM-130
fabricated_data_suite:
  batteries:
  - fabricated
  datasets:
  - baseline_4class
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 4
    proportions:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    balance: unbalanced
    skew_rule: geometric
    matching_mode: single
    split_rule: proportional_to_size
    spillover_rule: uniform
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
    target_metric:
      type: mcc
      value: 0.6
      scope: pair
    single_match:
      cluster: 0
      label: 0
