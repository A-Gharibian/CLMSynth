# [CLM-120] target_metric: no feasible alpha at any recall level

global_settings:
  data_source: fabricated_data
  output_dir: Z:\Output\CLM-120
fabricated_data_suite:
  batteries:
  - fabricated
  datasets:
  - baseline_4class
  seed: 42
label_generation:
  n_labels: 1
  source_labeling: labels0
  noise: 0.1
  seed: 42
  clm_label:
    num_classes: 4
    proportions:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    balance: unbalanced
    skew_rule: geometric
    matching_mode: custom
    assignment_matrix:
    - clusters:
      - 1
      label: 1
      recall_target: 0.8
    - clusters:
      - 2
      label: 2
      recall_target: 0.8
    - clusters:
      - 3
      label: 3
      recall_target: 0.8
    split_rule: proportional_to_size
    spillover_rule: proportional_to_marginal
    centroid_dependence:
      enabled: true
      profile: linear
      favors: core
    target_metric:
      type: mcc
      value: 0.5
    competing_noise:
    - cluster: 0
      label: 1
      share: 0.7
      favors: random
    - cluster: 0
      label: 2
      share: 0.7
      favors: random
